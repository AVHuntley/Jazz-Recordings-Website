# Single source of truth for all sources.
# - `id`      : anchor used in citation links (bibliography.html#<id>)
# - `label`   : short form shown in section Sources lists and marker tooltips
# - `citation`: full entry (markdown), rendered on the bibliography page
#
# To cite in prose, link a page locator to the anchor:  [p. 41](bibliography.html#gioia-2008)
# The build turns it into a numbered footnote automatically.


# Site-wide vocabulary. One entry per term.
# - term: displayed name (anchor on the vocabulary page = its slug)
# - definition: markdown allowed; also shown (as plain text) in hover tooltips
# - source/sourceTitle: the lesson where the term is introduced

- term: 'Barbershop quartet singing'
  definition: 'A small-group choral style characterized by homophonic, close-harmony, and four-part arrangements.'
  source: vocal-ensembles
  sourceTitle: 'Vocal Ensembles'

- term: 'Bebop'
  definition: 'A style of jazz developed in the late 30s and early 40s. Characterized by fast tempos, chromaticism, and virtuosic improvisation. The style was pioneered by Charlie Parker, Dizzy Gillespie, and Thelonious Monk.'
  source: diz-and-bird
  sourceTitle: 'Diz and Bird'

- term: 'Block chords'
  definition: 'Chords played in a blocked texture, where all voices move together in the same direction.'
  source: swing-era-soloists
  sourceTitle: 'Swing Era Soloists'

- term: 'Blue notes'
  definition: 'Microtonal pitches that lie between the notes of the well-tempered (Western) musical scale, a little sharp or flat, difficult to transcribe using standard notation.'
  source: jazz-origins
  sourceTitle: 'Jazz Origins'

- term: 'Bossa Nova'
  definition: 'A Brazilian musicalstyle that emerged in the late 1950s, blending samba with a quieter, more subdued aesthetic, featuring guitar, soft vocals, and complex harmonies.'
  source: afro-caribbean-and-brazilian-jazz
  sourceTitle: 'Afro-Caribbean & Brazilian Jazz'

- term: 'Call-and-response'
  definition: 'A musical structure in which a leader (or soloist) makes a musical statement (the call) and the ensemble, or another musician, answers with a direct or contrasting reply (the response).'
  source: jazz-origins
  sourceTitle: 'Jazz Origins'

- term: 'Clave'
  definition: 'A two-part rhythmic pattern that organizes the entire ensemble. The clave is the foundation of Afro-Caribbean music, and is often played on a pair of wooden sticks called claves.'
  source: afro-caribbean-and-brazilian-jazz
  sourceTitle: 'Afro-Caribbean & Brazilian Jazz'

- term: 'Contrafact'
  definition: 'A composition that features a new melody over the harmony of an existing tune'
  source: diz-and-bird
  sourceTitle: 'Diz and Bird'

- term: 'Cruzado'
  definition: 'Playing rhythms that contradict the established clave, creating tension.'
  source: afro-caribbean-and-brazilian-jazz
  sourceTitle: 'Afro-Caribbean & Brazilian Jazz'

- term: 'Cu-bop'
  definition: 'A mix of Cuban music and bebop.'
  source: bebop-era-big-bands
  sourceTitle: 'Bebop Era Big Bands'

- term: 'Dropping Bombs'
  definition: 'Bebop slang for when a drummer plays strong bass drum hits as punctuation.'
  source: diz-and-bird
  sourceTitle: 'Diz and Bird'

- term: 'Flatted Fifth (or #4)'
  definition: 'A pitch that is one half-step lower than the perfect fifth of a scale. In jazz, the flatted fifth is often used in blues and bebop contexts, creating a dissonant sound that adds tension and color to the music.'
  source: diz-and-bird
  sourceTitle: 'Diz and Bird'

- term: 'Ghost band'
  definition: 'A band that plays under the name of a deceased leader.'
  source: contemporary-big-bands
  sourceTitle: 'Contemporary Big Bands'

- term: 'Head-solos-head form'
  aka: ['chorus form', 'strophic form', 'head-solo-head']
  definition: |-
    The standard performance practice in jazz, where a chord progression is repeated throughout a piece, which begins and ends with the composed melody, and between, players improvise.

- term: 'Improvisation'
  definition: 'Performing without a preconceived or notated part.'
  source: jazz-origins
  sourceTitle: 'Jazz Origins'

- term: 'Jazz standard'
  definition: 'A popular instrumental or vocal piece that has become a part of the standard repertoire of jazz musicians.'
  source: hard-bop
  sourceTitle: 'Hard Bop'

- term: 'Montuno'
  definition: 'A repeating piano pattern or vamp used in Afro-Caribbean music, often in the song’s later “open” section.'
  source: afro-caribbean-and-brazilian-jazz
  sourceTitle: 'Afro-Caribbean & Brazilian Jazz'

- term: 'Moña'
  definition: 'A horn line or layered horn riff section in Afro-Caribbean music, often appearing during a montuno or mambo section.'
  source: afro-caribbean-and-brazilian-jazz
  sourceTitle: 'Afro-Caribbean & Brazilian Jazz'

- term: 'Rehearsal band'
  definition: 'A big band that meets for enjoyment and practice, or to play new compositions and arrangements, only occasionally performing in front of an audience'
  source: big-bands-of-the-1960s
  sourceTitle: 'Big Bands of the 1960s'

- term: 'Rhythm section'
  definition: 'The group of instruments that provide the harmonic and rhythmic foundation for a jazz ensemble, typically including piano, bass, drums, and sometimes guitar or percussion.'
  source: early-jazz
  sourceTitle: 'Early Jazz'

- term: 'Sectional form'
  aka: ['multithematic form', 'multi-strain form', 'strain-based form']
  definition: 'A muscal structure in which the composition is divided into distinct sections, each with its own melody, harmony, and rhythm. Typical in marches and ragtime.'
  source: early-jazz
  sourceTitle: 'Early Jazz'

- term: 'Salsa'
  definition: 'A catch-all term for Afro-Caribbean music designed primarily for dancing, often featuring a vocalist and horn section.'
  source: afro-caribbean-and-brazilian-jazz
  sourceTitle: 'Afro-Caribbean & Brazilian Jazz'

- term: 'Shout chorus'
  definition: 'A climactic section of a big band arrangement, often featuring the full ensemble playing in unison or harmony, typically occurring near the end of a piece.'
  source: early-big-bands
  sourceTitle: 'Early Big Bands'

- term: 'Solo break'
  definition: 'The rhythm section stops playing behind a soloist for a brief period, often about half-way through a song form.'
  source: early-jazz
  sourceTitle: 'Early Jazz'

- term: 'Stop time'
  definition: 'A musical device in which the rhythm section stops playing for a brief period, allowing a soloist or ensemble to play unaccompanied or with minimal accompaniment. Often used to create dramatic effect or highlight a particular moment in a performance.'
  source: early-jazz
  sourceTitle: 'Early Jazz'

- term: 'Strain'
  definition: 'A section of a composition that uses a *sectional* or *multithematic* form, which is typical in marches and ragtime.'
  source: jazz-origins
  sourceTitle: 'Jazz Origins'

- term: 'Swing (rhythm)'
  definition: 'A rhythmic feel that interprets eighth notes as long on downbeats and short on upbeats, creating a "long-short" feel. Notated either as 8th-note triplet or dotted 16ths subdivisions.'
  source: jazz-origins
  sourceTitle: 'Jazz Origins'

- term: 'Syncopation'
  definition: 'A rhythmic device in which the expected beat is displaced or accented in an unexpected way.'
  source: jazz-origins
  sourceTitle: 'Jazz Origins'

- term: 'Tailgate trombone'
  definition: 'A style of trombone playing that features techniques such as growling, scoops, falls, and slides. Named for the way Dixieland trombonists would often sit and play at the back of an open trailer.'
  source: early-jazz
  sourceTitle: 'Early Jazz'

- term: 'Three-horn front line'
  definition: 'A common configuration in early jazz ensembles, consisting of three horn players (typically trumpet, clarinet, and trombone) who play the melody and harmonies together.'
  source: early-jazz
  sourceTitle: 'Early Jazz'

- term: 'Tin Pan Alley'
  definition: 'A collection of New York City music publishers responsible for writing many of the songs now considered part of the “great American songbook”'
  source: diz-and-bird
  sourceTitle: 'Diz and Bird'

- term: 'Tumbao'
  definition: 'A repeating bass (and sometimes piano/percussion) pattern in Afro-Caribbean music, emphasizing offbeats (like the “and” of 2 and 4).'
  source: afro-caribbean-and-brazilian-jazz
  sourceTitle: 'Afro-Caribbean & Brazilian Jazz'

- term: 'Vocalese'
  definition: 'The practice of writing and singing lyrics to preexisting melodies. These melodies can be the composed "head" of a song, or, frequently, a recorded improvised solo.'
  source: vocal-ensembles
  sourceTitle: 'Vocal Ensembles'
